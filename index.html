<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Catálogo</title>
<style>
  :root{
    --bg:#f3f7fc;
    --paper:#ffffff;
    --ink:#12243a;
    --muted:#5c6f82;
    --line:#dbe6f2;
    --accent:#1c3f66;
    --accent-2:#2f6fed;
    --accent-soft:#e3edfa;
    --accent-ink:#ffffff;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:96px;
  }

  /* ---------- Cabeçalho ---------- */
  .topo{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    padding:18px 16px 12px;
    border-bottom:1px solid var(--line);
  }
  .topo h1{
    margin:0 0 2px; font-size:22px; font-weight:700; letter-spacing:-0.01em; color:var(--accent);
  }
  .topo p{ margin:0 0 14px; font-size:13px; color:var(--muted); }

  .busca{
    display:flex; align-items:center; gap:8px;
    background:var(--paper); border:1px solid var(--line);
    border-radius:999px; padding:10px 14px;
  }
  .busca svg{ flex:0 0 auto; opacity:0.5; color:var(--accent); }
  .busca input{
    border:none; outline:none; background:transparent; font-size:15px;
    width:100%; color:var(--ink);
  }
  .busca input::placeholder{ color:var(--muted); }

  /* ---------- Caixinha de categorias ---------- */
  .caixa-categorias{ margin-top:10px; position:relative; }
  .botao-categorias{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    background:var(--paper); border:1px solid var(--line); border-radius:12px;
    padding:11px 14px; font-size:14px; color:var(--ink); cursor:pointer;
  }
  .botao-categorias .rotulo{ display:flex; align-items:center; gap:8px; }
  .botao-categorias .rotulo b{ color:var(--accent); font-weight:600; }
  .botao-categorias .seta{ transition:transform 0.2s ease; color:var(--muted); }
  .botao-categorias.aberto .seta{ transform:rotate(180deg); }

  .painel-categorias{
    display:none; flex-wrap:wrap; gap:8px;
    background:var(--paper); border:1px solid var(--line); border-radius:12px;
    padding:12px; margin-top:6px;
  }
  .painel-categorias.aberto{ display:flex; }
  .chip-cat{
    border:1px solid var(--line); background:var(--bg);
    color:var(--ink); border-radius:999px; padding:8px 15px; font-size:13.5px;
    cursor:pointer;
  }
  .chip-cat.ativo{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }

  /* ---------- Grade de produtos ---------- */
  .grade{
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
    padding:16px;
    max-width:560px; margin:0 auto;
  }
  .cartao{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden; display:flex; flex-direction:column; cursor:pointer;
  }
  .cartao .imagem{
    aspect-ratio:1/1; background:var(--accent-soft);
    display:flex; align-items:center; justify-content:center;
    font-size:34px; position:relative;
  }
  .cartao .imagem img{ width:100%; height:100%; object-fit:cover; }
  .cartao .conteudo{ padding:10px 12px 12px; display:flex; flex-direction:column; gap:2px; flex:1; }
  .cartao .categoria-label{ font-size:11px; color:var(--accent-2); font-weight:600; }
  .cartao .nome{ font-size:14px; font-weight:600; line-height:1.3; margin:0; }

  .add-linha{ margin-top:8px; display:flex; align-items:center; justify-content:flex-end; min-height:32px; }
  .btn-add{
    width:32px; height:32px; border-radius:999px; border:1px solid var(--accent);
    background:var(--paper); color:var(--accent); font-size:18px; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .stepper{
    display:flex; align-items:center; gap:10px; background:var(--accent);
    border-radius:999px; padding:4px 6px;
  }
  .stepper button{
    width:24px; height:24px; border-radius:999px; border:none; background:var(--accent-ink);
    color:var(--accent); font-size:15px; line-height:1; cursor:pointer;
  }
  .stepper .qtd{ color:var(--accent-ink); font-size:13.5px; font-weight:700; min-width:12px; text-align:center; }

  .vazio{
    grid-column:1/-1; text-align:center; color:var(--muted); font-size:14px; padding:40px 16px;
  }

  /* ---------- Barra flutuante do carrinho ---------- */
  .barra-carrinho{
    position:fixed; left:16px; right:16px; bottom:16px; z-index:30;
    max-width:528px; margin:0 auto;
    background:var(--accent); color:var(--accent-ink);
    border-radius:999px; padding:6px 6px 6px 20px;
    display:none; align-items:center; justify-content:space-between;
    box-shadow:0 8px 24px rgba(18,36,58,0.22);
  }
  .barra-carrinho.mostrar{ display:flex; }
  .barra-carrinho .txt{ font-size:14px; font-weight:600; }
  .barra-carrinho button{
    background:var(--accent-ink); color:var(--accent); border:none;
    border-radius:999px; padding:12px 18px; font-size:14px; font-weight:700; cursor:pointer;
  }

  /* ---------- Fundo comum dos painéis ---------- */
  .fundo-painel{
    position:fixed; inset:0; background:rgba(12,24,40,0.45); z-index:40;
    display:none;
  }
  .fundo-painel.mostrar{ display:block; }
  .painel{
    position:fixed; left:0; right:0; bottom:0; z-index:41;
    background:var(--paper); border-radius:20px 20px 0 0;
    max-height:85vh; overflow-y:auto;
    transform:translateY(100%); transition:transform 0.25s ease;
    padding:18px 16px 20px;
  }
  .painel.mostrar{ transform:translateY(0); }
  .painel-topo{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .painel-topo h2{ font-size:17px; margin:0; color:var(--accent); }
  .fechar-painel{ border:none; background:var(--accent-soft); color:var(--accent); width:30px; height:30px; border-radius:999px; font-size:16px; cursor:pointer; flex:0 0 auto; }

  /* ---------- Painel do pedido ---------- */
  .linha-pedido{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0; border-bottom:1px solid var(--line); gap:10px;
  }
  .linha-pedido .nome-item{ font-size:14px; }
  .linha-pedido .nome-item small{ display:block; color:var(--muted); font-size:12px; margin-top:1px; }

  .obs{
    width:100%; margin-top:14px; border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; font-size:14px; font-family:inherit; resize:none; min-height:60px;
    color:var(--ink);
  }
  .obs::placeholder{ color:var(--muted); }

  .btn-whats{
    display:block; width:100%; text-align:center; text-decoration:none;
    background:var(--accent); color:var(--accent-ink); font-size:15px; font-weight:700;
    padding:15px; border-radius:12px; border:none; cursor:pointer; margin-top:16px;
  }
  .nota-preco{ font-size:12.5px; color:var(--muted); text-align:center; margin-top:10px; }

  /* ---------- Painel de detalhe do produto ---------- */
  .galeria{
    display:flex; overflow-x:auto; gap:10px; scroll-snap-type:x mandatory;
    border-radius:12px; margin-bottom:4px;
  }
  .galeria::-webkit-scrollbar{ display:none; }
  .galeria .slide{
    flex:0 0 100%; scroll-snap-align:start; aspect-ratio:1/1;
    background:var(--accent-soft); border-radius:12px;
    display:flex; align-items:center; justify-content:center; font-size:54px;
    overflow:hidden;
  }
  .galeria .slide img{ width:100%; height:100%; object-fit:cover; }
  .pontos{ display:flex; justify-content:center; gap:6px; margin:8px 0 4px; }
  .pontos span{ width:6px; height:6px; border-radius:999px; background:var(--line); }
  .pontos span.ativo{ background:var(--accent); }

  .detalhe-categoria{ font-size:12px; color:var(--accent-2); font-weight:600; margin-top:10px; }
  .detalhe-nome{ font-size:18px; font-weight:700; margin:2px 0 8px; }
  .detalhe-desc{ font-size:14px; color:var(--muted); line-height:1.55; margin:0; }

  .detalhe-add{ display:flex; align-items:center; justify-content:space-between; margin-top:18px; }
  .detalhe-add .rotulo{ font-size:13.5px; color:var(--muted); }
</style>
</head>
<body>

<div class="topo">
  <h1>Nome da Loja</h1>
  <p>Escolha os itens — o valor é combinado no WhatsApp</p>
  <div class="busca">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="campoBusca" type="text" placeholder="Buscar produto...">
  </div>

  <div class="caixa-categorias">
    <button type="button" class="botao-categorias" id="botaoCategorias">
      <span class="rotulo">Categoria: <b id="categoriaAtualTexto">Tudo</b></span>
      <span class="seta">▾</span>
    </button>
    <div class="painel-categorias" id="painelCategorias"></div>
  </div>
</div>

<div class="grade" id="grade"></div>

<div class="barra-carrinho" id="barraCarrinho">
  <span class="txt" id="textoBarra">0 itens selecionados</span>
  <button id="abrirPainelPedido">Ver pedido</button>
</div>

<div class="fundo-painel" id="fundoPainel"></div>

<div class="painel" id="painelPedido">
  <div class="painel-topo">
    <h2>Seu pedido</h2>
    <button class="fechar-painel" id="fecharPainelPedido">✕</button>
  </div>
  <div id="listaPainel"></div>
  <textarea class="obs" id="observacao" placeholder="Alguma observação? (opcional) Ex: prefiro retirar, entregar até sexta..."></textarea>
  <button class="btn-whats" id="btnWhats">Pedir orçamento no WhatsApp</button>
  <p class="nota-preco">Sem preços aqui — te respondo com valores certinhos pelo WhatsApp.</p>
</div>

<div class="painel" id="painelDetalhe">
  <div class="painel-topo">
    <h2>Detalhes</h2>
    <button class="fechar-painel" id="fecharPainelDetalhe">✕</button>
  </div>
  <div id="conteudoDetalhe"></div>
</div>

<script>
/* =======================================================
   1) SEU NÚMERO DE WHATSAPP
======================================================= */
const NUMERO_WHATSAPP = "5511996991711";

/* =======================================================
   2) SEUS PRODUTOS
   - "categoria" gera os filtros sozinho.
   - "imagens": lista de links de foto. Pode ter mais de uma.
     Sem link, mostra o ícone em todos os slides.
   - "descricao": texto curto que aparece ao abrir o produto.
   - Sem preço aqui de propósito — combinam no WhatsApp.
======================================================= */
const PRODUTOS = [
  {
    nome: "Camiseta oversized preta",
    categoria: "Camisetas",
    icone: "👕",
    imagens: [],
    descricao: "Camiseta 100% algodão, corte oversized, tingimento artesanal peça a peça — cada uma sai levemente diferente da outra."
  },
  {
    nome: "Camiseta oversized branca",
    categoria: "Camisetas",
    icone: "👕",
    imagens: [],
    descricao: "Mesmo corte oversized da preta, em tecido mais leve. Boa pra usar por cima ou sozinha."
  },
  {
    nome: "Camiseta listrada",
    categoria: "Camisetas",
    icone: "👕",
    imagens: [],
    descricao: "Listras finas, malha canelada, caimento reto. Vem em tamanho único, estilo boxy."
  },
  {
    nome: "Boné trucker preto",
    categoria: "Bonés",
    icone: "🧢",
    imagens: [],
    descricao: "Tela respirável atrás, aba curva, fecho de encaixe ajustável. Serve na maioria das cabeças."
  },
  {
    nome: "Boné trucker bege",
    categoria: "Bonés",
    icone: "🧢",
    imagens: [],
    descricao: "Mesmo modelo do preto, em bege. Combina bem com peças mais claras."
  },
  {
    nome: "Boné aba reta",
    categoria: "Bonés",
    icone: "🧢",
    imagens: [],
    descricao: "Aba reta, estrutura mais firme, visual streetwear. Ajuste por fivela na parte de trás."
  },
  {
    nome: "Boné street verde",
    categoria: "Bonés",
    icone: "🧢",
    imagens: [],
    descricao: "Verde musgo, bordado discreto na frente. Aba curva, tecido leve."
  },
  {
    nome: "Moletom básico cinza",
    categoria: "Moletons",
    icone: "🧥",
    imagens: [],
    descricao: "Moletom canguru, fleece por dentro, punho e barra ribana. Corte confortável, não é justo."
  }
];

/* ======================= CÓDIGO ======================= */

const estado = PRODUTOS.map(() => ({ qtd: 0 }));
let categoriaAtiva = "Tudo";
let termoBusca = "";
let indiceDetalheAberto = null;
let slideAtual = 0;

const grade = document.getElementById("grade");
const painelCategorias = document.getElementById("painelCategorias");
const botaoCategorias = document.getElementById("botaoCategorias");
const categoriaAtualTexto = document.getElementById("categoriaAtualTexto");
const barraCarrinho = document.getElementById("barraCarrinho");
const textoBarra = document.getElementById("textoBarra");
const fundoPainel = document.getElementById("fundoPainel");

const painelPedido = document.getElementById("painelPedido");
const listaPainel = document.getElementById("listaPainel");

const painelDetalhe = document.getElementById("painelDetalhe");
const conteudoDetalhe = document.getElementById("conteudoDetalhe");

const categorias = ["Tudo", ...Array.from(new Set(PRODUTOS.map(p => p.categoria)))];

categorias.forEach(cat => {
  const chip = document.createElement("button");
  chip.type = "button";
  chip.className = "chip-cat" + (cat === categoriaAtiva ? " ativo" : "");
  chip.textContent = cat;
  chip.addEventListener("click", () => {
    categoriaAtiva = cat;
    categoriaAtualTexto.textContent = cat;
    painelCategorias.querySelectorAll(".chip-cat").forEach(c => c.classList.remove("ativo"));
    chip.classList.add("ativo");
    fecharCategorias();
    renderizarGrade();
  });
  painelCategorias.appendChild(chip);
});

function abrirCategorias(){
  painelCategorias.classList.add("aberto");
  botaoCategorias.classList.add("aberto");
}
function fecharCategorias(){
  painelCategorias.classList.remove("aberto");
  botaoCategorias.classList.remove("aberto");
}
botaoCategorias.addEventListener("click", () => {
  if (painelCategorias.classList.contains("aberto")) fecharCategorias();
  else abrirCategorias();
});

function produtosFiltrados(){
  return PRODUTOS
    .map((p, i) => ({ ...p, i }))
    .filter(p => categoriaAtiva === "Tudo" || p.categoria === categoriaAtiva)
    .filter(p => p.nome.toLowerCase().includes(termoBusca.toLowerCase()));
}

function renderizarGrade(){
  const itens = produtosFiltrados();
  grade.innerHTML = "";

  if (itens.length === 0){
    grade.innerHTML = '<div class="vazio">Nenhum produto encontrado.</div>';
    return;
  }

  itens.forEach(p => {
    const cartao = document.createElement("div");
    cartao.className = "cartao";

    const imagemHtml = (p.imagens && p.imagens[0])
      ? `<img src="${p.imagens[0]}" alt="${p.nome}">`
      : p.icone;

    cartao.innerHTML = `
      <div class="imagem">${imagemHtml}</div>
      <div class="conteudo">
        <span class="categoria-label">${p.categoria}</span>
        <p class="nome">${p.nome}</p>
        <div class="add-linha" data-i="${p.i}"></div>
      </div>
    `;
    cartao.addEventListener("click", (ev) => {
      if (ev.target.closest(".add-linha")) return;
      abrirDetalhe(p.i);
    });
    grade.appendChild(cartao);
    renderizarAddLinha(p.i);
  });
}

function renderizarAddLinha(i){
  const container = document.querySelector(`.add-linha[data-i="${i}"]`);
  if (!container) return;
  const qtd = estado[i].qtd;

  if (qtd === 0){
    container.innerHTML = `<button type="button" class="btn-add">+</button>`;
    container.querySelector(".btn-add").addEventListener("click", (ev) => {
      ev.stopPropagation();
      estado[i].qtd = 1;
      renderizarAddLinha(i);
      atualizarBarra();
    });
  } else {
    container.innerHTML = `
      <div class="stepper">
        <button type="button" class="menos">−</button>
        <span class="qtd">${qtd}</span>
        <button type="button" class="mais">+</button>
      </div>
    `;
    container.querySelector(".menos").addEventListener("click", (ev) => {
      ev.stopPropagation();
      estado[i].qtd = Math.max(0, estado[i].qtd - 1);
      renderizarAddLinha(i);
      atualizarBarra();
    });
    container.querySelector(".mais").addEventListener("click", (ev) => {
      ev.stopPropagation();
      estado[i].qtd++;
      renderizarAddLinha(i);
      atualizarBarra();
    });
  }
}

function totalItens(){
  return estado.reduce((soma, e) => soma + e.qtd, 0);
}

function atualizarBarra(){
  const total = totalItens();
  if (total > 0){
    barraCarrinho.classList.add("mostrar");
    textoBarra.textContent = total === 1 ? "1 item selecionado" : `${total} itens selecionados`;
  } else {
    barraCarrinho.classList.remove("mostrar");
    fecharTodosPaineis();
  }
  if (indiceDetalheAberto !== null) atualizarStepperDetalhe();
}

/* ---------- Painel do pedido ---------- */

function renderizarPainelPedido(){
  listaPainel.innerHTML = "";
  PRODUTOS.forEach((p, i) => {
    if (estado[i].qtd === 0) return;
    const linha = document.createElement("div");
    linha.className = "linha-pedido";
    linha.innerHTML = `
      <span class="nome-item">${p.nome}<small>${p.categoria}</small></span>
      <div class="stepper" style="background:var(--accent)">
        <button type="button" class="menos">−</button>
        <span class="qtd">${estado[i].qtd}</span>
        <button type="button" class="mais">+</button>
      </div>
    `;
    linha.querySelector(".menos").addEventListener("click", () => {
      estado[i].qtd = Math.max(0, estado[i].qtd - 1);
      renderizarPainelPedido();
      renderizarAddLinha(i);
      atualizarBarra();
    });
    linha.querySelector(".mais").addEventListener("click", () => {
      estado[i].qtd++;
      renderizarPainelPedido();
      renderizarAddLinha(i);
      atualizarBarra();
    });
    listaPainel.appendChild(linha);
  });
}

function abrirPainelPedidoFn(){
  renderizarPainelPedido();
  painelPedido.classList.add("mostrar");
  fundoPainel.classList.add("mostrar");
}

document.getElementById("abrirPainelPedido").addEventListener("click", abrirPainelPedidoFn);
document.getElementById("fecharPainelPedido").addEventListener("click", fecharTodosPaineis);
fundoPainel.addEventListener("click", fecharTodosPaineis);

function fecharTodosPaineis(){
  painelPedido.classList.remove("mostrar");
  painelDetalhe.classList.remove("mostrar");
  fundoPainel.classList.remove("mostrar");
  indiceDetalheAberto = null;
}

/* ---------- Painel de detalhe do produto ---------- */

function abrirDetalhe(i){
  indiceDetalheAberto = i;
  slideAtual = 0;
  const p = PRODUTOS[i];

  const imagens = (p.imagens && p.imagens.length) ? p.imagens : [null];
  const slidesHtml = imagens.map(url =>
    `<div class="slide">${url ? `<img src="${url}" alt="${p.nome}">` : p.icone}</div>`
  ).join("");
  const pontosHtml = imagens.length > 1
    ? `<div class="pontos">${imagens.map((_, idx) => `<span class="${idx === 0 ? 'ativo' : ''}"></span>`).join("")}</div>`
    : "";

  conteudoDetalhe.innerHTML = `
    <div class="galeria" id="galeriaDetalhe">${slidesHtml}</div>
    ${pontosHtml}
    <div class="detalhe-categoria">${p.categoria}</div>
    <h3 class="detalhe-nome">${p.nome}</h3>
    <p class="detalhe-desc">${p.descricao || ""}</p>
    <div class="detalhe-add">
      <span class="rotulo">Quantidade</span>
      <div class="add-linha" data-i="${i}" data-contexto="detalhe" style="min-height:auto"></div>
    </div>
  `;

  renderizarAddLinha(i);

  const galeria = document.getElementById("galeriaDetalhe");
  if (imagens.length > 1){
    galeria.addEventListener("scroll", () => {
      const idx = Math.round(galeria.scrollLeft / galeria.clientWidth);
      conteudoDetalhe.querySelectorAll(".pontos span").forEach((s, si) => {
        s.classList.toggle("ativo", si === idx);
      });
    });
  }

  painelDetalhe.classList.add("mostrar");
  fundoPainel.classList.add("mostrar");
}

function atualizarStepperDetalhe(){
  if (indiceDetalheAberto !== null) renderizarAddLinha(indiceDetalheAberto);
}

document.getElementById("fecharPainelDetalhe").addEventListener("click", fecharTodosPaineis);

/* ---------- Busca ---------- */

document.getElementById("campoBusca").addEventListener("input", (e) => {
  termoBusca = e.target.value;
  renderizarGrade();
});

/* ---------- Envio pro WhatsApp ---------- */

document.getElementById("btnWhats").addEventListener("click", () => {
  const linhas = [];
  PRODUTOS.forEach((p, i) => {
    if (estado[i].qtd > 0) linhas.push(`• ${estado[i].qtd}x ${p.nome}`);
  });
  if (linhas.length === 0) return;

  const observacao = document.getElementById("observacao").value.trim();

  let mensagem = "Olá! Gostaria de um orçamento para:\n" + linhas.join("\n");
  if (observacao) mensagem += "\n\nObservação: " + observacao;
  mensagem += "\n\nPode me passar os valores e a forma de entrega?";

  const link = "https://wa.me/" + NUMERO_WHATSAPP + "?text=" + encodeURIComponent(mensagem);
